name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'
  NX_INTERACTIVE: 'false'

jobs:
  checks:
    name: Linux checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin package manager
        run: npm install --global npm@11.19.0
      - run: npm ci
      - name: Lint and typecheck
        run: npm exec -- nx run-many -t lint typecheck -p reader reader-ui
      - name: Tests including deterministic fixture verification
        run: npm exec -- nx run reader:test
      - name: Validate specification references
        run: npm exec -- nx run reader:spec-check
      - name: Format tracked source and specifications
        env:
          NX_FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm exec -- nx format:check --base="$NX_FORMAT_BASE"
      - name: Production build
        run: npm exec -- nx build reader
      - name: Dependency audit (report only; release gate tracked separately)
        if: always()
        continue-on-error: true
        run: npm audit

  windows-installer:
    name: Windows installer
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin package manager
        run: npm install --global npm@11.19.0
      - run: npm ci
      - name: Verify fixtures and run unit tests on Windows
        run: npm exec -- nx run reader:test
      - name: Build Windows installer without publishing
        run: npm exec -- nx run reader:make
      - name: Retain unsigned installer for manual smoke testing
        uses: actions/upload-artifact@v4
        with:
          name: reader-windows-x64-unsigned
          path: dist/executables/**/*.exe
          if-no-files-found: error
          retention-days: 14
